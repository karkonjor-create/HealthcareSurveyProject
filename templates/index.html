<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Income & Spending Survey</title>
</head>
<body>

    <h1>Healthcare Income & Spending Survey</h1>

<form method="POST" action="/submit">
        <p>
            <label>Age:</label><br>
            <input type="number" name="age">
        </p>

        <p>
            <label>Gender:</label><br>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </p>

        <p>
            <label>Total Monthly Income:</label><br>
            <input type="number" name="income">
        </p>

        <h3>Monthly Expenses</h3>

        <p>
            <input type="checkbox" name="utilities">
            Utilities

            <input type="number" name="utilities_amount"
                   placeholder="Amount">
        </p>

        <p>
            <input type="checkbox" name="shopping">
            Shopping

            <input type="number" name="shopping_amount"
                   placeholder="Amount">
        </p>

        <p>
            <input type="checkbox" name="healthcare">
            Healthcare

            <input type="number" name="healthcare_amount"
                   placeholder="Amount">
        </p>

        <p>
            <input type="submit" value="Submit Survey">
        </p>

    </form>

</body>
</html>
